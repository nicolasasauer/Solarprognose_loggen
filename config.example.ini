# ============================================================
#  Konfiguration Solarprognose-Logger  --  VORLAGE
#
#  Diese Datei einmalig kopieren nach config.ini, am einfachsten mit
#      python3 solarprognose.py --init-config
#
#  config.ini steht in .gitignore: ein "git pull" holt neuen Code,
#  fasst deine Einstellungen aber nie an.
# ============================================================

[global]

# Basisverzeichnis fuer alle Daten. Ohne Angabe: das Verzeichnis, in dem
# solarprognose.py liegt. Alle folgenden relativen Pfade beziehen sich darauf.
# base_dir = /home/nicolas/scripts/Solarprognose_loggen

# Verzeichnis fuer die TXT-Dateien (Originalformat der API)
output_dir = data

# Pfad zur SQLite-Datenbank
db_path = solarprognose.db

# Logdatei
log_file = logs/solarprognose.log

# Praefix des Dateinamens: <prefix>_<Standortlabel>_<Abrufdatum>.txt
filename_prefix = Solardaten

# HTTP-Timeout in Sekunden (gesamt pro Versuch)
timeout_seconds = 60

# Anzahl der Versuche pro Standort innerhalb eines Laufs
retries = 3

# Wartezeit zwischen den Versuchen in Sekunden (waechst: 1x, 2x, 3x ...)
retry_delay_seconds = 60

# Pause zwischen zwei Standorten in Sekunden (schont das Rate-Limit)
delay_between_locations = 10

# true = Standorte ueberspringen, fuer die es heute schon einen
#        erfolgreichen Abruf gab. Damit koennen mehrere Cron-Zeiten
#        als Fallback dienen, ohne doppelt zu laden.
skip_if_already_fetched_today = true

# Optionaler Shell-Befehl, der bei endgueltigem Fehlschlag ausgefuehrt
# wird. {standort} und {fehler} werden ersetzt. Leer lassen = aus.
# notify_command = curl -s -d "Solarprognose {standort}: {fehler}" https://ntfy.sh/mein-topic
notify_command =


# ------------------------------------------------------------
#  Standorte
#
#  Ein Abschnitt [Standort:LABEL] pro Anlage. LABEL landet 1:1 im
#  Dateinamen und in der Datenbank - also z.B. RT_Tr fuer
#  Solardaten_RT_Tr_2026-08-27.txt
#
#  URL-Schema: /estimate/<lat>/<lon>/<declination>/<azimuth>/<kwp>
#    declination = Neigung in Grad, 0 = waagerecht, 90 = senkrecht
#    azimuth     = -90 = Ost, 0 = Sued, 90 = West, +/-180 = Nord
#    kwp         = installierte Leistung in kWp
#
#  Zwei Nachkommastellen bei den Koordinaten reichen voellig aus;
#  das Wettermodell arbeitet ohnehin groeber.
# ------------------------------------------------------------

[Standort:RT_Tr]
latitude = 48.14
longitude = 11.58
declination = 35
azimuth = 0
kwp = 5.5
timezone = Europe/Berlin

